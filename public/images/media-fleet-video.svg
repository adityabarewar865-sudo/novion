<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="fleetBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#021c27"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#fleetBg)"/>
  <!-- Map topography routes -->
  <g stroke="#0284c7" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M50 280 C 150 200, 250 250, 350 180 C 450 110, 520 150, 580 90"/>
    <path d="M80 320 C 180 240, 290 280, 420 190 C 500 140, 550 190, 590 140"/>
  </g>
  <!-- Vehicle fleet markers -->
  <g transform="translate(180, 180)">
    <circle cx="0" cy="0" r="14" fill="#0284c7" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="7" fill="#38bdf8"/>
    <rect x="15" y="-12" width="70" height="24" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="22" y="4" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9" font-weight="600">EV-TRK #104</text>
  </g>
  <g transform="translate(380, 140)">
    <circle cx="0" cy="0" r="14" fill="#10b981" fill-opacity="0.3"/>
    <circle cx="0" cy="0" r="7" fill="#10b981"/>
    <rect x="15" y="-12" width="70" height="24" rx="4" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="22" y="4" fill="#ecfdf5" font-family="system-ui, sans-serif" font-size="9" font-weight="600">EV-BUS #02</text>
  </g>
  <!-- Play Button Overlay -->
  <circle cx="300" cy="170" r="38" fill="#0284c7" fill-opacity="0.95"/>
  <polygon points="292,154 316,170 292,186" fill="#ffffff"/>
  <!-- Badge -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#000000" fill-opacity="0.6"/>
  <text x="32" y="38" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VIDEO DEMO · 4:10</text>
  <text x="30" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Commercial EV Fleet Telematics Hub</text>
</svg>
