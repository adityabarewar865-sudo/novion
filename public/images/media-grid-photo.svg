<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="gridBg" x1="0%" y1="0%" x2="1" y2="1">
      <stop offset="0%" stop-color="#05101f"/>
      <stop offset="100%" stop-color="#0b1727"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#gridBg)"/>
  <!-- Utility Solar / Wind silhouettes -->
  <g stroke="#0284c7" stroke-width="1.5" opacity="0.3">
    <line x1="500" y1="90" x2="500" y2="230"/>
    <line x1="500" y1="90" x2="470" y2="120"/>
    <line x1="500" y1="90" x2="530" y2="120"/>
    <line x1="540" y1="120" x2="540" y2="230"/>
  </g>
  <!-- Storage containers -->
  <rect x="70" y="110" width="190" height="130" rx="8" fill="#0f2138" stroke="#38bdf8" stroke-width="2"/>
  <rect x="280" y="110" width="190" height="130" rx="8" fill="#0f2138" stroke="#38bdf8" stroke-width="2"/>
  <!-- Door lines -->
  <line x1="165" y1="110" x2="165" y2="240" stroke="#081422" stroke-width="2"/>
  <line x1="375" y1="110" x2="375" y2="240" stroke="#081422" stroke-width="2"/>
  <!-- HVAC vents on container -->
  <g fill="#081422">
    <rect x="85" y="125" width="60" height="8" rx="2"/>
    <rect x="85" y="138" width="60" height="8" rx="2"/>
    <rect x="295" y="125" width="60" height="8" rx="2"/>
    <rect x="295" y="138" width="60" height="8" rx="2"/>
  </g>
  <text x="175" y="150" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">NOVION BESS-01</text>
  <text x="385" y="150" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12" font-weight="700">NOVION BESS-02</text>
  <!-- Status LEDs -->
  <circle cx="230" cy="180" r="5" fill="#38bdf8"/>
  <circle cx="440" cy="180" r="5" fill="#38bdf8"/>
  <text x="220" y="200" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10">2.5 MWh</text>
  <text x="430" y="200" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10">2.5 MWh</text>
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#000000" fill-opacity="0.6"/>
  <text x="32" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">GRID DEPLOYMENT</text>
  <text x="30" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Smart Grid Battery Energy Storage (BESS) Containers</text>
</svg>
