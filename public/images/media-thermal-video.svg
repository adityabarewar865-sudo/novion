<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <radialGradient id="thermalHot" cx="40%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="60%" stop-color="#eab308" stop-opacity="0.4"/>
      <stop offset="90%" stop-color="#06b6d4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </radialGradient>
  </defs>
  <rect width="600" height="340" fill="#030712"/>
  <rect x="50" y="50" width="500" height="240" rx="12" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- Thermal image effect -->
  <rect x="52" y="52" width="496" height="236" rx="10" fill="url(#thermalHot)"/>
  <!-- Infrared grid crosshairs -->
  <g stroke="#ffffff" stroke-width="1" stroke-dasharray="2,2" opacity="0.4">
    <line x1="50" y1="170" x2="550" y2="170"/>
    <line x1="300" y1="50" x2="300" y2="290"/>
    <circle cx="240" cy="165" r="30" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="none"/>
  </g>
  <rect x="250" y="145" width="100" height="24" rx="4" fill="#000000" fill-opacity="0.75"/>
  <text x="260" y="161" fill="#fca5a5" font-family="monospace" font-size="11" font-weight="700">Tmax: 38.4°C</text>
  <!-- Play Button Overlay -->
  <circle cx="300" cy="170" r="38" fill="#f97316" fill-opacity="0.95"/>
  <polygon points="292,154 316,170 292,186" fill="#ffffff"/>
  <!-- Badge -->
  <rect x="20" y="20" width="130" height="28" rx="6" fill="#000000" fill-opacity="0.6"/>
  <text x="32" y="38" fill="#fdba74" font-family="system-ui, sans-serif" font-size="11" font-weight="700">VIDEO DEMO · 3:15</text>
  <text x="30" y="315" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Thermal Forecasting &amp; Hotspot Mitigation</text>
</svg>
