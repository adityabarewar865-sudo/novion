<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bmsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d18" />
      <stop offset="50%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#040b14" />
    </linearGradient>
    <linearGradient id="lightningGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <radialGradient id="plasmaRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#050d18" stop-opacity="0" />
    </radialGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bmsBg)" stroke="#1e3a5f" stroke-width="2" />
  <circle cx="300" cy="190" r="160" fill="url(#plasmaRadial)" />

  <!-- PCB Circuit Traces -->
  <g stroke="#0369a1" stroke-width="1.5" opacity="0.4" fill="none">
    <path d="M50 80h100l40 40h70" />
    <path d="M50 300h120l50-50h40" />
    <path d="M550 80h-90l-40 40h-80" />
    <path d="M550 300h-110l-40-40h-60" />
    <circle cx="50" cy="80" r="3" fill="#38bdf8" />
    <circle cx="50" cy="300" r="3" fill="#0284c7" />
    <circle cx="550" cy="80" r="3" fill="#38bdf8" />
    <circle cx="550" cy="300" r="3" fill="#0284c7" />
  </g>

  <!-- Central AI Neural Processing Core with N Logo Arrow motif -->
  <rect x="220" y="110" width="160" height="160" rx="20" fill="#0b172a" stroke="url(#lightningGlow)" stroke-width="2.5" filter="url(#neon)" />
  <rect x="245" y="135" width="110" height="110" rx="14" fill="#031f38" stroke="#38bdf8" stroke-width="1.5" />

  <!-- Stylized N Arrow Lightning in Core -->
  <path d="M272 215L288 160L298 190L322 155M322 155L310 157M322 155L322 170" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M273 213L288 162L298 189L320 157" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="300" y="275" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    NOVION NEURAL EDGE BMS
  </text>

  <!-- Cell Monitor Array Left -->
  <g transform="translate(60, 110)">
    <rect width="120" height="42" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5" />
    <text x="14" y="22" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cell 01 - 04 SOH</text>
    <text x="14" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">99.8% (Optimal)</text>

    <rect y="58" width="120" height="42" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5" />
    <text x="14" y="80" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Thermal Gradient</text>
    <text x="14" y="92" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">ΔT &lt; 0.8°C</text>

    <rect y="116" width="120" height="42" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5" />
    <text x="14" y="138" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Cell Balance ΔV</text>
    <text x="14" y="150" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">1.2 mV (Balanced)</text>
  </g>

  <!-- Live AI Predictive Right -->
  <g transform="translate(420, 110)">
    <rect width="130" height="42" rx="8" fill="#0b172a" stroke="#0284c7" stroke-width="1.5" />
    <text x="14" y="22" fill="#f0f9ff" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Thermal Forecast</text>
    <text x="14" y="34" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Zero Hotspots (+96h)</text>

    <rect y="58" width="130" height="42" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5" />
    <text x="14" y="80" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Dendrite Risk</text>
    <text x="14" y="92" fill="#7dd3fc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">0.02% (Extremely Low)</text>

    <rect y="116" width="130" height="42" rx="8" fill="#0b172a" stroke="#1e3a5f" stroke-width="1.5" />
    <text x="14" y="138" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Sampling Rate</text>
    <text x="14" y="150" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="10" font-weight="700">100 kHz Micro-scan</text>
  </g>

  <!-- Connectors -->
  <line x1="180" y1="131" x2="220" y2="150" stroke="#0ea5e9" stroke-width="2" />
  <line x1="180" y1="189" x2="220" y2="190" stroke="#38bdf8" stroke-width="2" />
  <line x1="180" y1="247" x2="220" y2="230" stroke="#0ea5e9" stroke-width="2" />

  <line x1="380" y1="150" x2="420" y2="131" stroke="#0ea5e9" stroke-width="2" />
  <line x1="380" y1="190" x2="420" y2="189" stroke="#38bdf8" stroke-width="2" />
  <line x1="380" y1="230" x2="420" y2="247" stroke="#0ea5e9" stroke-width="2" />

  <text x="300" y="340" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">
    Proactive Intelligence · Active Failure Preemption · Autonomous Cell Safety
  </text>
</svg>
