<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e1a" />
      <stop offset="50%" stop-color="#0f1b2d" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Grid Blueprint Overlay -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="40" y1="40" x2="560" y2="40" />
    <line x1="40" y1="100" x2="560" y2="100" />
    <line x1="40" y1="160" x2="560" y2="160" />
    <line x1="40" y1="220" x2="560" y2="220" />
    <line x1="40" y1="280" x2="560" y2="280" />
    <line x1="40" y1="340" x2="560" y2="340" />
    <line x1="100" y1="40" x2="100" y2="340" />
    <line x1="200" y1="40" x2="200" y2="340" />
    <line x1="300" y1="40" x2="300" y2="340" />
    <line x1="400" y1="40" x2="400" y2="340" />
    <line x1="500" y1="40" x2="500" y2="340" />
  </g>

  <!-- Title Badge -->
  <rect x="50" y="45" width="230" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
  <text x="70" y="67" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">EV ARCHITECTURE PROTOCOL</text>
  <circle cx="260" cy="62" r="4" fill="#00d2ff" filter="url(#glow)" />

  <!-- EV Chassis Blueprint -->
  <rect x="70" y="110" width="460" height="190" rx="14" fill="#091026" stroke="#334155" stroke-width="2" />
  
  <!-- Wheels -->
  <circle cx="150" cy="300" r="32" fill="#0f172a" stroke="#64748b" stroke-width="4" />
  <circle cx="150" cy="300" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <circle cx="450" cy="300" r="32" fill="#0f172a" stroke="#64748b" stroke-width="4" />
  <circle cx="450" cy="300" r="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />

  <!-- Battery Pack Sub-assembly (Center of Chassis) -->
  <rect x="180" y="160" width="240" height="95" rx="8" fill="#0b1b30" stroke="url(#cyanBlue)" stroke-width="2.5" filter="url(#glow)" />
  <text x="195" y="185" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">MODULAR LI-ION PACK</text>
  <text x="195" y="202" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">800V Architecture · 98 kWh · LFP/NMC</text>

  <!-- Cell Array Graphic -->
  <g transform="translate(195, 215)">
    <rect x="0" y="0" width="30" height="24" rx="4" fill="#0284c7" opacity="0.9" />
    <rect x="36" y="0" width="30" height="24" rx="4" fill="#0284c7" opacity="0.9" />
    <rect x="72" y="0" width="30" height="24" rx="4" fill="#0284c7" opacity="0.9" />
    <rect x="108" y="0" width="30" height="24" rx="4" fill="#0284c7" opacity="0.9" />
    <rect x="144" y="0" width="30" height="24" rx="4" fill="#0284c7" opacity="0.9" />
    <rect x="180" y="0" width="30" height="24" rx="4" fill="#38bdf8" opacity="1" />
  </g>

  <!-- Technical Callouts -->
  <line x1="120" y1="135" x2="190" y2="170" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3" />
  <rect x="80" y="120" width="110" height="26" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="1" />
  <text x="90" y="137" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Thermal Loop: Active</text>

  <line x1="410" y1="180" x2="490" y2="135" stroke="#00d2ff" stroke-width="1.5" stroke-dasharray="3,3" />
  <rect x="440" y="120" width="120" height="26" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
  <text x="450" y="137" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="600">AIS 156 / UN38.3 Cert</text>

  <rect x="225" y="325" width="150" height="28" rx="14" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="245" y="343" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Fleet Transition Hub</text>
</svg>
